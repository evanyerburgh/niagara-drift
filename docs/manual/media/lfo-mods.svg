<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="Inter Tight, Helvetica Neue, Arial, sans-serif">
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<!-- Mods' three knobs: Speed mod, Delay mod and Cross-mod. Drawn in the site's colors (web/manual/manual.css), as lfo-chain.svg. -->
<defs>
  <marker id="lfo-mods-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#dcbcff"/></marker>
  <marker id="lfo-mods-d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#ffb04a"/></marker>
  <marker id="lfo-mods-e" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#45e3d3"/></marker>
  <marker id="lfo-mods-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#ffd6f0"/></marker>
</defs>
<rect width="760" height="240" rx="16" fill="#24081f"/>
<rect x="16" y="10" width="232" height="220" rx="12" fill="none" stroke="#d3b3c4" stroke-opacity=".45" stroke-width="1.2"/>
<text x="132" y="28" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" letter-spacing="1.3" fill="#d3b3c4" text-anchor="middle">SPEED MOD</text>
<rect x="84.0" y="51" width="96" height="34" rx="17" fill="none" stroke="#dcbcff" stroke-width="1.5"/>
<text x="132" y="73.5" font-size="16" fill="#dcbcff" text-anchor="middle" font-weight="600">Clock</text>
<rect x="77.0" y="141" width="110" height="34" rx="17" fill="none" stroke="#dcbcff" stroke-width="1.5"/>
<text x="132" y="163.5" font-size="16" fill="#dcbcff" text-anchor="middle" font-weight="600">LFO I · II</text>
<path d="M132 85 V138" fill="none" stroke="#dcbcff" stroke-width="2" marker-end="url(#lfo-mods-a)"/>
<path d="M187 158 C234 158 234 68 183 68" fill="none" stroke="#ffd6f0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#lfo-mods-p)"/>
<text x="132" y="204" font-size="13" fill="#d3b3c4" text-anchor="middle">KNOB 1: how far, ±3 octaves</text>
<text x="132" y="222" font-size="13" fill="#d3b3c4" text-anchor="middle">KNOB 2: which LFO, I, II or both</text>
<rect x="264" y="10" width="232" height="220" rx="12" fill="none" stroke="#d3b3c4" stroke-opacity=".45" stroke-width="1.2"/>
<text x="380" y="28" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" letter-spacing="1.3" fill="#d3b3c4" text-anchor="middle">DELAY MOD</text>
<rect x="325.0" y="51" width="110" height="34" rx="17" fill="none" stroke="#dcbcff" stroke-width="1.5"/>
<text x="380" y="73.5" font-size="16" fill="#dcbcff" text-anchor="middle" font-weight="600">LFO I · II</text>
<path d="M380 85 V100" fill="none" stroke="#dcbcff" stroke-width="2"/>
<rect x="352.0" y="100" width="56" height="28" rx="6" fill="#24081f" stroke="#fbe9f2" stroke-width="1.5"/>
<text x="380" y="119" font-size="14" fill="#fbe9f2" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace">D#5</text>
<path d="M380 128 V141" fill="none" stroke="#dcbcff" stroke-width="2" marker-end="url(#lfo-mods-a)"/>
<text x="380" y="164" font-size="16" fill="#ffd6f0" text-anchor="middle" font-weight="600">Delay time</text>
<text x="380" y="204" font-size="13" fill="#d3b3c4" text-anchor="middle">KNOB 3: how far, ±25%</text>
<text x="380" y="222" font-size="13" fill="#d3b3c4" text-anchor="middle">× Movement; heard with delay mix</text>
<rect x="512" y="10" width="232" height="220" rx="12" fill="none" stroke="#d3b3c4" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="628" y="28" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" letter-spacing="1.3" fill="#d3b3c4" text-anchor="middle">CROSS-MOD · NOT THE LFO</text>
<rect x="540.0" y="51" width="64" height="34" rx="17" fill="none" stroke="#ffb04a" stroke-width="1.5"/>
<text x="572" y="73.5" font-size="16" fill="#ffb04a" text-anchor="middle" font-weight="600">I</text>
<rect x="652.0" y="51" width="64" height="34" rx="17" fill="none" stroke="#45e3d3" stroke-width="1.5"/>
<text x="684" y="73.5" font-size="16" fill="#45e3d3" text-anchor="middle" font-weight="600">II</text>
<path d="M606 62 H650" fill="none" stroke="#ffb04a" stroke-width="2" marker-end="url(#lfo-mods-d)"/>
<path d="M650 76 H606" fill="none" stroke="#45e3d3" stroke-width="2" marker-end="url(#lfo-mods-e)"/>
<rect x="600.0" y="100" width="56" height="28" rx="6" fill="#24081f" stroke="#fbe9f2" stroke-width="1.5"/>
<text x="628" y="119" font-size="14" fill="#fbe9f2" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace">F#5</text>
<text x="628" y="148" font-size="13.5" fill="#fbe9f2" text-anchor="middle">I moves II's cutoff</text>
<text x="628" y="166" font-size="13.5" fill="#fbe9f2" text-anchor="middle">bend each other (cross-FM)</text>
<text x="628" y="184" font-size="13.5" fill="#fbe9f2" text-anchor="middle">Snarl: the sound bends both</text>
<text x="628" y="214" font-size="13" fill="#d3b3c4" text-anchor="middle">KNOB 4: how deep</text>
</svg>
