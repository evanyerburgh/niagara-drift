<!-- The screen reader, top to bottom (the phone's reader.svg). Drawn in the site's colors (web/manual/manual.css), as lfo-chain.svg. -->
<defs>
  <marker id="reader-tall-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#dcbcff"/></marker>
  <marker id="reader-tall-d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#ffb04a"/></marker>
  <marker id="reader-tall-e" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#45e3d3"/></marker>
  <marker id="reader-tall-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#ffd6f0"/></marker>
</defs>
<rect width="360" height="330" rx="16" fill="#24081f"/>
<rect x="130.0" y="17" width="100" height="34" rx="17" fill="none" stroke="#ffd6f0" stroke-width="1.5"/>
<text x="180" y="39.5" font-size="16" fill="#ffd6f0" text-anchor="middle" font-weight="600">FM-1</text>
<path d="M180 51 V70" fill="none" stroke="#ffd6f0" stroke-width="2"/>
<rect x="152.0" y="70" width="56" height="28" rx="6" fill="#24081f" stroke="#fbe9f2" stroke-width="1.5"/>
<text x="180" y="89" font-size="14" fill="#fbe9f2" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace">USB</text>
<path d="M180 98 V118" fill="none" stroke="#ffd6f0" stroke-width="2" marker-end="url(#reader-tall-p)"/>
<rect x="100" y="122" width="160" height="56" rx="12" fill="none" stroke="#dcbcff" stroke-width="1.5"/>
<text x="180" y="146" font-size="16" fill="#dcbcff" text-anchor="middle" font-weight="600">Screen Reader</text>
<text x="180" y="166" font-size="13" fill="#d3b3c4" text-anchor="middle">Chrome or Edge</text>
<path d="M180 178 C180 200 90 196 90 222" fill="none" stroke="#dcbcff" stroke-width="2" marker-end="url(#reader-tall-a)"/>
<path d="M180 178 C180 200 270 196 270 222" fill="none" stroke="#dcbcff" stroke-width="2" marker-end="url(#reader-tall-a)"/>
<text x="90" y="246" font-size="15" fill="#fbe9f2" text-anchor="middle" font-weight="600">its own voice</text>
<text x="270" y="246" font-size="15" fill="#fbe9f2" text-anchor="middle" font-weight="600">your screen</text>
<text x="270" y="264" font-size="15" fill="#fbe9f2" text-anchor="middle" font-weight="600">reader</text>
<text x="270" y="284" font-size="12.5" fill="#d3b3c4" text-anchor="middle">VoiceOver, NVDA,</text>
<text x="270" y="300" font-size="12.5" fill="#d3b3c4" text-anchor="middle">JAWS, TalkBack</text>
