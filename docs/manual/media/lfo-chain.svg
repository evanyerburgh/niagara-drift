<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 186" font-family="Inter Tight, Helvetica Neue, Arial, sans-serif">
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<!-- One LFO send, left to right: drone I's pitch send (the LFO sends page). Drawn in the site's colors
     (web/manual/manual.css): the LFO lilac, drone I amber, the keys in boxes as the text's [[F#3]]. -->
<defs>
  <marker id="lc-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 8 4 0 8z" fill="#dcbcff"/>
  </marker>
  <marker id="lc-d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 8 4 0 8z" fill="#ffb04a"/>
  </marker>
</defs>
<rect width="760" height="186" rx="16" fill="#24081f"/>

<!-- the steps, named above -->
<g font-family="IBM Plex Mono, Menlo, monospace" font-size="11" letter-spacing="1.3" fill="#d3b3c4" text-anchor="middle">
  <text x="186" y="30">WHICH LFO</text>
  <text x="300" y="30">HOW MUCH</text>
  <text x="404" y="30">SCALED BY</text>
  <text x="508" y="30">MOVES</text>
</g>

<!-- the two LFOs -->
<g font-size="16" font-weight="600" fill="#dcbcff" text-anchor="middle">
  <rect x="24" y="52" width="88" height="34" rx="17" fill="none" stroke="#dcbcff" stroke-width="1.5"/>
  <text x="68" y="74">LFO I</text>
  <rect x="24" y="124" width="88" height="34" rx="17" fill="none" stroke="#dcbcff" stroke-width="1.5"/>
  <text x="68" y="146">LFO II</text>
</g>

<!-- the wires: the LFO's wave, lilac, until it reaches the drone -->
<g fill="none" stroke="#dcbcff" stroke-width="2">
  <path d="M112 69 C136 69 140 105 158 105"/>
  <path d="M112 141 C136 141 140 105 158 105"/>
  <path d="M214 105 H272" marker-end="url(#lc-a)"/>
  <path d="M328 105 H384" marker-end="url(#lc-a)"/>
  <path d="M424 105 H474" marker-end="url(#lc-a)"/>
</g>
<g fill="none" stroke="#ffb04a" stroke-width="2">
  <path d="M542 105 C566 105 568 69 600 69" marker-end="url(#lc-d)"/>
  <path d="M542 105 C566 105 568 141 600 141" marker-end="url(#lc-d)" stroke-dasharray="5 4"/>
</g>

<!-- which LFO: the key -->
<rect x="158" y="91" width="56" height="28" rx="6" fill="#24081f" stroke="#fbe9f2" stroke-width="1.5"/>
<text x="186" y="110" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" fill="#fbe9f2" text-anchor="middle">F#3</text>

<!-- how much: KNOB 1 -->
<circle cx="300" cy="105" r="25" fill="#14000f"/>
<circle cx="300" cy="105" r="20" fill="#0a0a0b" stroke="#3a3a40" stroke-width="2"/>
<line x1="300" y1="89" x2="300" y2="97" stroke="#e8e8ea" stroke-width="3"/>

<!-- scaled by Movement -->
<circle cx="404" cy="105" r="18" fill="none" stroke="#dcbcff" stroke-width="1.5"/>
<text x="404" y="111" font-size="18" fill="#dcbcff" text-anchor="middle">×</text>

<!-- moves: the key -->
<rect x="478" y="91" width="64" height="28" rx="6" fill="#24081f" stroke="#fbe9f2" stroke-width="1.5"/>
<text x="510" y="110" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" fill="#fbe9f2" text-anchor="middle">G#3</text>

<!-- what it moves: drone I's pitch, or its X-Wave with the key on -->
<g font-size="16" font-weight="600" fill="#ffb04a">
  <text x="610" y="75">I pitch</text>
  <text x="610" y="147">I X-Wave</text>
</g>
<g font-size="12.5" fill="#d3b3c4">
  <text x="610" y="92">key off</text>
  <text x="610" y="164">key on</text>
</g>

<!-- what each step is, below -->
<g font-size="13" fill="#d3b3c4" text-anchor="middle">
  <text x="186" y="146">I, II or both</text>
  <text x="300" y="150">KNOB 1</text>
  <text x="300" y="166">middle: none</text>
  <text x="404" y="146">Movement</text>
  <text x="404" y="162">(ALGORITHM)</text>
</g>

</svg>
