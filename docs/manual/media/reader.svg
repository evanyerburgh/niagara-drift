<!-- The screen reader: the FM-1 over USB to the Screen Reader page, which speaks or hands the words on. Drawn in the site's colors (web/manual/manual.css), as lfo-chain.svg. -->
<defs>
  <marker id="reader-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#dcbcff"/></marker>
  <marker id="reader-d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#ffb04a"/></marker>
  <marker id="reader-e" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#45e3d3"/></marker>
  <marker id="reader-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#ffd6f0"/></marker>
</defs>
<rect width="760" height="180" rx="16" fill="#24081f"/>
<text x="80" y="34" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" letter-spacing="1.3" fill="#d3b3c4" text-anchor="middle">PLUG IN</text>
<text x="330" y="34" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" letter-spacing="1.3" fill="#d3b3c4" text-anchor="middle">OPEN, CONNECT</text>
<text x="610" y="34" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" letter-spacing="1.3" fill="#d3b3c4" text-anchor="middle">LISTEN</text>
<rect x="30.0" y="73" width="100" height="34" rx="17" fill="none" stroke="#ffd6f0" stroke-width="1.5"/>
<text x="80" y="95.5" font-size="16" fill="#ffd6f0" text-anchor="middle" font-weight="600">FM-1</text>
<rect x="162.0" y="76" width="56" height="28" rx="6" fill="#24081f" stroke="#fbe9f2" stroke-width="1.5"/>
<text x="190" y="95" font-size="14" fill="#fbe9f2" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace">USB</text>
<path d="M130 90 H160" fill="none" stroke="#ffd6f0" stroke-width="2"/>
<path d="M218 90 H246" fill="none" stroke="#ffd6f0" stroke-width="2" marker-end="url(#reader-p)"/>
<rect x="250" y="62" width="160" height="56" rx="12" fill="none" stroke="#dcbcff" stroke-width="1.5"/>
<text x="330" y="86" font-size="16" fill="#dcbcff" text-anchor="middle" font-weight="600">Screen Reader</text>
<text x="330" y="106" font-size="13" fill="#d3b3c4" text-anchor="middle">Chrome or Edge</text>
<path d="M410 90 C440 90 440 62 470 62" fill="none" stroke="#dcbcff" stroke-width="2" marker-end="url(#reader-a)"/>
<path d="M410 90 C440 90 440 120 470 120" fill="none" stroke="#dcbcff" stroke-width="2" marker-end="url(#reader-a)"/>
<text x="480" y="67" font-size="15" fill="#fbe9f2" text-anchor="start" font-weight="600">its own voice</text>
<text x="480" y="125" font-size="15" fill="#fbe9f2" text-anchor="start" font-weight="600">your screen reader</text>
<text x="480" y="143" font-size="12.5" fill="#d3b3c4" text-anchor="start">VoiceOver, NVDA, JAWS, TalkBack</text>
</svg>
